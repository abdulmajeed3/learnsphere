version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: learnsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnsphere
      POSTGRES_PASSWORD: learnsphere_dev_password
      POSTGRES_DB: learnsphere_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learnsphere -d learnsphere_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: learnsphere-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnsphere
      POSTGRES_PASSWORD: learnsphere_test_password
      POSTGRES_DB: learnsphere_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learnsphere -d learnsphere_test']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
